name: Inspect update publication
on:
  push:
    branches: [diagnose-update70]
permissions:
  actions: write
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read publication status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/nicolenkoe/enduro-club-downloads/actions/runs/44284647255/cancel || true
          gh api 'repos/nicolenkoe/enduro-club-downloads/actions/runs?head_sha=92daa06fca4f25e21564eac99e027c74a532da6d&per_page=10' > /tmp/update-runs.json
          python3 - <<'PYREPORT'
          import json,subprocess
          output=[]
          for run in json.load(open('/tmp/update-runs.json'))['workflow_runs']:
              jobs=json.loads(subprocess.check_output(['gh','api',run['jobs_url']]))
              output.append({'name':run['name'],'status':run['status'],'conclusion':run['conclusion'],'url':run['html_url'],'jobs':jobs})
          import zipfile,io
          logs=subprocess.run(['gh','api','repos/nicolenkoe/enduro-club-downloads/actions/runs/44284647255/logs'],capture_output=True)
          if logs.returncode==0 and output:
              try:
                  archive=zipfile.ZipFile(io.BytesIO(logs.stdout))
                  output[0]['oldInstallLogs']={name:archive.read(name).decode('utf8','replace')[-7000:] for name in archive.namelist() if 'Install neural' in name}
              except Exception:pass
          open('/tmp/probe.json','w').write(json.dumps(output,indent=2))
          PYREPORT
          git config user.name 'Enduro publication diagnostics'
          git config user.email 'checks@users.noreply.github.com'
          blob=$(git hash-object -w /tmp/probe.json)
          tree=$(printf '100644 blob %s\tstatus.json\n' "$blob" | git mktree)
          commit=$(printf 'Publication status\n' | git commit-tree "$tree")
          git push origin "$commit:refs/heads/update70-status" --force

