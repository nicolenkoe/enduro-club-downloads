name: Publish APK download page
on:
  push:
    branches: [main]
    paths-ignore:
      - 'hvost-pod-kontrolem/**'
      - 'hvost-apk-parts/**'
      - 'hvost-build.py'
      - '.github/workflows/hvost-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: download-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural female voice tools
        run: |
          python -m pip install piper-tts==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate Russian female neural narration
        run: python3 make-neural-guide.py
      - name: Generate owner release checklist video
        run: python3 make-owner-guide.py
      - name: Assemble and verify the complete APK
        run: python3 build.py
      - name: Install browser verification tools
        shell: bash
        run: |
          npm install --no-save --prefix /tmp/browser-check playwright@1.56.1 2>&1 | tee /tmp/browser-tools.log
          /tmp/browser-check/node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee -a /tmp/browser-tools.log
          if ! command -v google-chrome >/dev/null; then /tmp/browser-check/node_modules/.bin/playwright install chrome; fi
      - name: Verify real browser race before publication
        shell: bash
        id: browser_check
        env:
          PLAYWRIGHT_PACKAGE: /tmp/browser-check/node_modules/playwright/index.mjs
        run: |
          python3 checks/serve.py > /tmp/browser-server.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid"' EXIT
          { node checks/browser-game.mjs && node checks/webgl-recovery.mjs && node checks/video-controls.mjs && node checks/release-list.mjs; } 2>&1 | tee /tmp/browser-check.log
      - uses: actions/configure-pages@v5
        id: pages_config
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish download page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify complete anonymous external download
        id: download
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --output /tmp/downloaded.apk "${PAGE_URL%/}/Enduro-0.15.69.apk"
          cmp _site/Enduro-0.15.69.apk /tmp/downloaded.apk
          sha256sum /tmp/downloaded.apk
          curl --fail --location --retry 5 --retry-delay 10 --output /tmp/browser-index.html "${PAGE_URL%/}/play/"
          cmp _site/play/index.html /tmp/browser-index.html
          python3 - <<'PYGAME'
          import os,pathlib,subprocess
          for file in pathlib.Path('_site/play/assets').iterdir():
              if file.suffix in ['.js','.glb']:
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--retry','3','--output','/tmp/game-asset',os.environ['PAGE_URL'].rstrip('/')+'/play/assets/'+file.name],check=True)
                  assert pathlib.Path('/tmp/game-asset').read_bytes()==file.read_bytes(),file.name
          PYGAME
      - name: Record deployment and download result
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          BROWSER_RESULT: ${{ steps.browser_check.outcome }}
          PAGES_CONFIG_OUTCOME: ${{ steps.pages_config.outcome }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYREPORT'
          import os,json,datetime
          report={'pagesConfigResult':os.environ.get('PAGES_CONFIG_OUTCOME',''), 'version':'0.15.69','pageUrl':os.environ.get('PAGE_URL',''),'downloadResult':os.environ.get('DOWNLOAD_OUTCOME','not-run'),'runUrl':os.environ['RUN_URL'],'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          import hashlib
          if os.path.exists('/tmp/browser-tools.log'):report['browserToolsLogTail']=open('/tmp/browser-tools.log').read()[-5000:]
          if os.path.exists('/tmp/browser-check.log'):report['browserCheckLogTail']=open('/tmp/browser-check.log').read()[-8000:]
          report['browserResult']=os.environ.get('BROWSER_RESULT','not-run')
          report['browserGameSha256']=hashlib.sha256(open('browser-game/index.html','rb').read()).hexdigest()
          report['sourceCommit']=os.environ.get('COMMIT_SHA','')
          if os.path.exists('site/voice-info.json'):report['voice']=json.load(open('site/voice-info.json'))
          report['pageSha256']=hashlib.sha256(open('site/index.html','rb').read()).hexdigest()
          import subprocess,zipfile,io
          prior=subprocess.run(['gh','api','repos/nicolenkoe/enduro-club-downloads/actions/runs/44000090296/logs'],capture_output=True)
          if prior.returncode==0:
              try:
                  archive=zipfile.ZipFile(io.BytesIO(prior.stdout))
                  report['previousRunErrors']=[line[-1200:] for name in archive.namelist() for line in archive.read(name).decode('utf8','replace').splitlines() if '##[error]' in line][:8]
              except Exception: pass
          open('/tmp/delivery-status.json','w').write(json.dumps(report,indent=2)+'\n')
          PYREPORT
          git config user.name 'Enduro delivery checks'
          git config user.email 'checks@users.noreply.github.com'
          report_blob=$(git hash-object -w /tmp/delivery-status.json)
          guide_blob=$(git hash-object -w site/guide.mp4)
          report_tree=$(printf '100644 blob %s\tstatus.json\n100644 blob %s\tguide.mp4\n' "$report_blob" "$guide_blob" | git mktree)
          report_commit=$(printf 'APK delivery verification result\n' | git commit-tree "$report_tree")
          git push origin "$report_commit:refs/heads/delivery-status" --force
